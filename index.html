<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Ocorrências - TP-LV Energy</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#edf2f7;padding:8px;}
h2{color:#003A8F;margin-bottom:15px;}
label{display:block;font-size:13px;color:#445;font-weight:600;margin:8px 4px 2px;}
input,select,textarea{
  padding:10px;margin:2px 4px;width:calc(100% - 8px);max-width:340px;
  border:1px solid #d7dde5;border-radius:10px;font-size:14px;background:#fff;
  font-family:inherit;
}
textarea{resize:vertical;min-height:56px;}
.linhaCampos{display:flex;flex-wrap:wrap;}
.linhaCampos > div{flex:1;min-width:150px;}
button{
  padding:11px 16px;margin:5px 4px;border:none;border-radius:10px;
  background:#003A8F;color:#fff;font-weight:600;cursor:pointer;transition:.2s;font-size:14px;
}
button:hover{transform:translateY(-1px);}
.btnSecundario{background:#78909c;}
.btnVerde{background:#00B050;}
.btnPdf{background:#003A8F;}
.btnPdf:disabled{opacity:.6;cursor:wait;transform:none;}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);margin-top:14px;overflow:hidden;padding:6px;}
#tela2{display:none;}
.listaItem{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee;gap:8px;}
.listaItem .info{font-size:13px;line-height:1.5;}
.tagProc{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;margin-right:6px;}
.procOBRA{background:#0B57D0;}
.procMANUTENCAO{background:#e53935;}
.procLV{background:#00B050;}
.procOUTRO{background:#78909c;}
.obsPreview{color:#777;font-style:italic;font-size:12px;}
.botoes{display:flex;gap:5px;flex-shrink:0;}
.editar{background:#fb8c00;padding:8px 10px;}
.excluir{background:#e53935;padding:8px 10px;}

.btnMassa{background:#6a1b9a;}
.blocoMassa textarea{min-height:150px;font-family:Consolas,monospace;font-size:12.5px;}
.dicaMassa{font-size:11px;color:#78909c;margin:0 4px 8px;line-height:1.5;}
.dicaMassa b{color:#445;}
.ferramentasLista{display:flex;flex-wrap:wrap;gap:8px;margin:10px 4px 4px;align-items:flex-end;}
.ferramentasLista > div{flex:1;min-width:150px;}
.ferramentasLista label{margin:0 0 2px;}
.ferramentasLista input,.ferramentasLista select{margin:0;max-width:none;}
.grupoTitulo{background:#f0f4fa;color:#003A8F;font-weight:800;font-size:13px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;}
.grupoQtd{background:#003A8F;color:#fff;border-radius:10px;padding:1px 9px;font-size:11px;}

/* RELATÓRIO */
.cabecalhoRelatorio{background:linear-gradient(135deg,#003A8F 0%,#0B57D0 55%,#00B050 100%);padding:16px;color:#fff;}
.topoFlex{display:flex;justify-content:space-between;align-items:center;gap:14px;}
.logoEsquerda{width:70px;height:70px;border-radius:18px;background:rgba(255,255,255,.15);display:flex;justify-content:center;align-items:center;font-size:34px;flex-shrink:0;}
.tituloCentral{flex:1;}
.tituloCentral h1{font-size:18px;font-weight:800;line-height:1.15;}
.infoData{margin-top:6px;font-size:12px;opacity:.95;}

.blocoTitulo{background:#003A8F;color:#fff;font-weight:700;font-size:13px;padding:9px 12px;letter-spacing:.3px;}

.tabela{background:#fff;overflow-x:auto;}
.linha{
  display:grid;grid-template-columns:0.8fr 1.4fr 1.4fr 1.4fr 1.5fr;
  gap:2px;padding:7px 3px;align-items:center;text-align:center;font-size:10px;border-bottom:1px solid #eef2f7;
}
.linha:not(.topoTabela) div{font-weight:600;}
.topoTabela{background:#f0f4fa;color:#003A8F;font-weight:700;position:sticky;top:0;}
.linhaTotal{background:#e8eefc;font-weight:800 !important;}
.linhaTotal div{font-weight:800 !important;}
.corOBRA{color:#0B57D0;}
.corMANUTENCAO{color:#e53935;}
.corLV{color:#00B050;}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px;}
.cardResumo{background:#fff;border-left:6px solid #003A8F;border-radius:14px;padding:12px;box-shadow:0 3px 12px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;min-height:74px;}
.cardIcone{font-size:24px;}
.cardTexto span{display:block;font-size:11px;font-weight:600;color:#666;}
.cardTexto strong{font-size:22px;color:#003A8F;}
.cardTexto small{font-size:10px;color:#888;}
.cardResumo:nth-child(1){border-left-color:#003A8F;}
.cardResumo:nth-child(2){border-left-color:#0B57D0;}
.cardResumo:nth-child(3){border-left-color:#e53935;}
.cardResumo:nth-child(4){border-left-color:#00B050;}
.cardResumo:nth-child(5){border-left-color:#546E7A;}

.blocoDupla{display:grid;grid-template-columns:1fr;gap:10px;padding:0 10px 10px;}
@media(min-width:700px){.blocoDupla{grid-template-columns:1fr 1fr;} .cards{grid-template-columns:repeat(4,1fr);}}

.painel{border:1px solid #eef2f7;border-radius:14px;overflow:hidden;margin-top:4px;}
.painelTitulo{background:#003A8F;color:#fff;font-weight:700;font-size:12px;padding:8px 10px;text-align:center;}

.donutWrap{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px;flex-wrap:wrap;}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex-shrink:0;}
.donut svg{position:absolute;top:0;left:0;width:100%;height:100%;}
.donutCentro{width:74px;height:74px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.donutCentro strong{font-size:22px;color:#003A8F;}
.donutCentro span{font-size:9px;color:#888;}
.legenda{font-size:12px;}
.legendaItem{display:flex;align-items:center;gap:6px;margin:4px 0;font-weight:600;}
.bolinha{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

.barrasWrap{padding:10px 12px;}
.barraLinha{display:grid;grid-template-columns:70px 1fr 30px;align-items:center;gap:6px;font-size:11px;margin:6px 0;}
.barraLabel{font-weight:700;color:#333;}
.barraFundo{background:#eef2f7;border-radius:6px;height:14px;overflow:hidden;}
.barraPreench{height:100%;border-radius:6px;}
.barraValor{text-align:right;font-weight:700;color:#333;}

.tabelaObs{width:100%;border-collapse:collapse;font-size:10.5px;}
.tabelaObs th{background:#003A8F;color:#fff;padding:7px 6px;text-align:left;}
.tabelaObs td{padding:7px 6px;border-bottom:1px solid #eef2f7;vertical-align:top;}
.tabelaObs tr:nth-child(even) td{background:#f8faff;}

.rodape{background:#003A8F;color:#fff;text-align:center;padding:14px;font-weight:700;font-size:14px;}
.semDados{padding:20px;text-align:center;color:#999;font-size:13px;}
</style>
</head>
<body>

<div id="tela1">
<h2>⚡ Cadastro de Ocorrências</h2>

<div class="linhaCampos">
<div>
<label>Ocorrência (OC)</label>
<input id="oc" placeholder="Ex: 40153">
</div>
<div>
<label>Equipe</label>
<input id="eq" list="listaEquipes" placeholder="Ex: ENG1023">
<datalist id="listaEquipes">
<option value="ENG1022"><option value="ENG1023"><option value="ENG1024">
<option value="ENG1025"><option value="ENG1026"><option value="ENG1027">
<option value="ENG1028"><option value="ENG1029"><option value="ENG1030">
<option value="ENG1031"><option value="ENG1032"><option value="ENG1033">
<option value="ENG1034"><option value="ENG1035">
<option value="ENG2012"><option value="ENG2013"><option value="ENG2014">
<option value="ENG2015"><option value="ENG2016"><option value="ENG2017">
<option value="ENG2018"><option value="ENG2019"><option value="ENG2020">
<option value="ENG2022"><option value="ENG5003">
<option value="SEM EQUIPE">
</datalist>
</div>
</div>

<div class="linhaCampos">
<div>
<label>Data da ocorrência</label>
<input id="dataOc" type="date">
</div>
<div>
<label>Processo (automático)</label>
<input id="procoDisplay" placeholder="Selecione a equipe" disabled>
</div>
</div>

<label>Observação (opcional)</label>
<textarea id="obs" placeholder="Ex: só deslocamento, aguardando material, etc."></textarea>

<br>
<button id="btnAdd" onclick="add()">Adicionar</button>
<button class="btnSecundario" onclick="limpar()">Limpar Tudo</button>
<button class="btnSecundario" onclick="atualizarDaPlanilha()">🔄 Atualizar</button>
<button class="btnMassa" onclick="toggleMassa()">📥 Cadastro em Massa</button>
<button class="btnVerde" onclick="visualizar()">Gerar Relatório</button>
<div id="statusSync" style="font-size:11px;color:#78909c;margin:4px 4px;min-height:14px;"></div>

<div id="blocoMassa" class="card blocoMassa" style="display:none;padding:12px;">
<label style="margin-top:0;">Cadastro em Massa — cole várias ocorrências de uma vez</label>
<div class="dicaMassa">
Cole diretamente da planilha (Excel/Google Sheets), <b>uma ocorrência por linha</b>.<br>
Ordem das colunas: <b>OC</b> · <b>Equipe</b> · <b>Data</b> · <b>Observação (opcional)</b><br>
Aceita colunas separadas por Tab (padrão ao colar de planilha), ou por <b>;</b> ou <b>,</b>. Data pode ser DD/MM/AAAA ou AAAA-MM-DD.
</div>
<textarea id="massaTexto" placeholder="40153	ENG1023	21/07/2026	só deslocamento
40200	ENG2020	23/07/2026
40201	ENG1032	24/07/2026"></textarea>
<button class="btnVerde" onclick="processarMassa()">✅ Cadastrar Todas</button>
<button class="btnSecundario" onclick="toggleMassa()">Cancelar</button>
<div id="statusMassa" style="font-size:12px;color:#445;margin:6px 4px;white-space:pre-line;"></div>
</div>

<div class="ferramentasLista">
<div>
<label>🔍 Buscar por número da OC</label>
<input id="buscaOc" placeholder="Ex: 40153" oninput="render()">
</div>
<div>
<label>Organizar lista por</label>
<select id="modoLista" onchange="render()">
<option value="data">Data (mais recente primeiro)</option>
<option value="equipe">Equipe</option>
</select>
</div>
</div>

<div id="lista" class="card"></div>
</div>

<div id="tela2">
<button class="btnSecundario" onclick="voltar()">← Voltar</button>
<button class="btnVerde" id="btnImagem" onclick="gerar()">📷 Gerar Imagem</button>
<button class="btnPdf" id="btnPdf" onclick="gerarPDF()">📄 Gerar PDF</button>
<div id="statusPdf" style="font-size:11px;color:#78909c;margin:4px 4px;min-height:14px;"></div>
<div id="relatorio" class="card"></div>
</div>

<script>
let dados = [];
let editIndex = null;

// 🔗 COLE AQUI O LINK DO SEU APP DA WEB (Google Apps Script) QUANDO FOR GERADO
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzf5OBd-BjS_Z7WvYsQZv0O7TzsMBXRStv87zMAAlLw4fYc7niIWVWOMfbbpPOX1SMg/exec";

const processos = {
  ENG1022:"OBRA", ENG1024:"OBRA", ENG1025:"OBRA", ENG1026:"OBRA", ENG1028:"OBRA",
  ENG1029:"OBRA", ENG1030:"OBRA", ENG1031:"OBRA", ENG1033:"OBRA", ENG1034:"OBRA", ENG1035:"OBRA",
  ENG1023:"MANUTENÇÃO", ENG1027:"MANUTENÇÃO", ENG1032:"MANUTENÇÃO", ENG5003:"MANUTENÇÃO",
  ENG2012:"LINHA VIVA", ENG2013:"LINHA VIVA", ENG2014:"LINHA VIVA", ENG2015:"LINHA VIVA",
  ENG2016:"LINHA VIVA", ENG2017:"LINHA VIVA", ENG2018:"LINHA VIVA", ENG2019:"LINHA VIVA",
  ENG2020:"LINHA VIVA", ENG2022:"LINHA VIVA"
};

const corProcesso = { "OBRA":"#0B57D0", "MANUTENÇÃO":"#e53935", "LINHA VIVA":"#00B050", "OUTRO":"#78909c" };
const classeProcesso = { "OBRA":"procOBRA", "MANUTENÇÃO":"procMANUTENCAO", "LINHA VIVA":"procLV", "OUTRO":"procOUTRO" };

function processoDe(eq){
  return processos[eq] || "OUTRO";
}

function gerarSvgDonut(totalGeral, totalProcesso, corProcesso){
  // Usa SVG (circle + stroke-dasharray) em vez de conic-gradient,
  // porque o html2canvas não renderiza conic-gradient corretamente.
  let tamanho = 130, raio = 52, centro = tamanho/2, espessura = 24;
  let circunferencia = 2 * Math.PI * raio;

  let segmentos = [
    { valor: totalProcesso.OBRA, cor: corProcesso.OBRA },
    { valor: totalProcesso["MANUTENÇÃO"], cor: corProcesso["MANUTENÇÃO"] },
    { valor: totalProcesso["LINHA VIVA"], cor: corProcesso["LINHA VIVA"] }
  ];

  let acumulado = 0;
  let circulos = `<circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="#dfe6ee" stroke-width="${espessura}"></circle>`;

  segmentos.forEach(seg=>{
    let fracao = totalGeral ? (seg.valor / totalGeral) : 0;
    if(fracao <= 0) return;
    let comprimento = fracao * circunferencia;
    let dasharray = `${comprimento} ${circunferencia - comprimento}`;
    let dashoffset = -acumulado;
    circulos += `<circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="${seg.cor}" stroke-width="${espessura}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" stroke-linecap="butt"></circle>`;
    acumulado += comprimento;
  });

  return `<svg width="${tamanho}" height="${tamanho}" viewBox="0 0 ${tamanho} ${tamanho}">
    <g transform="rotate(-90 ${centro} ${centro})">${circulos}</g>
  </svg>`;
}

function gerarId(){
  return Date.now() + "_" + Math.random().toString(36).substring(2,8);
}

function salvarLocal(){
  localStorage.setItem("dadosOcorrenciasTPLV", JSON.stringify(dados));
}

function carregarLocal(){
  let salvo = localStorage.getItem("dadosOcorrenciasTPLV");
  if(salvo){
    dados = JSON.parse(salvo);
    dados.forEach(d => d.data = normalizarData(d.data));
    render();
  }
}

function planilhaConfigurada(){
  return SCRIPT_URL && !SCRIPT_URL.includes("COLE_AQUI");
}

async function enviarParaPlanilha(item){
  if(!planilhaConfigurada()) return;
  mostrarStatus("🔄 Sincronizando...");
  try{
    await fetch(SCRIPT_URL, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({
        action:"salvar",
        item:{
          id: item.id,
          oc: item.oc,
          eq: item.eq,
          data: item.data,
          processo: processoDe(item.eq),
          obs: item.obs
        }
      })
    });
    mostrarStatus("✅ Sincronizado com a planilha");
  }catch(err){
    console.warn("Falha ao enviar para a planilha:", err);
    mostrarStatus("⚠️ Sem conexão — salvo só localmente");
  }
}

async function excluirDaPlanilha(item){
  if(!planilhaConfigurada()) return;
  try{
    await fetch(SCRIPT_URL, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ action:"excluir", item: item })
    });
  }catch(err){
    console.warn("Falha ao excluir na planilha:", err);
  }
}

async function carregarDaPlanilha(mostrarAlerta){
  if(!planilhaConfigurada()) return false;
  mostrarStatus("🔄 Carregando dados da planilha...");
  try{
    let resp = await fetch(SCRIPT_URL);
    let json = await resp.json();
    if(Array.isArray(json)){
      dados = json.map(r => ({
        id: r.ID || r.id,
        oc: r.OC || r.oc,
        eq: r.Equipe || r.eq,
        data: normalizarData(r.Data || r.data),
        obs: r["Observação"] || r.obs || ""
      }));
      salvarLocal();
      render();
      mostrarStatus("✅ Dados atualizados da planilha");
      if(mostrarAlerta) alert("Dados atualizados a partir da planilha!");
      return true;
    }
  }catch(err){
    console.warn("Falha ao carregar da planilha, usando dados locais:", err);
    mostrarStatus("⚠️ Sem conexão — mostrando dados locais");
  }
  return false;
}

async function atualizarDaPlanilha(){
  if(!planilhaConfigurada()){
    alert("Configure o link do Google Planilhas no código (SCRIPT_URL) para usar essa função.");
    return;
  }
  let ok = await carregarDaPlanilha(true);
  if(!ok) alert("Não foi possível conectar à planilha. Verifique sua internet.");
}

function mostrarStatus(msg){
  let el = document.getElementById("statusSync");
  if(!el) return;
  el.innerText = msg;
  clearTimeout(window._statusTimeout);
  window._statusTimeout = setTimeout(()=>{ el.innerText = ""; }, 4000);
}

eq.addEventListener("input", () => {
  let p = processoDe(eq.value.trim().toUpperCase());
  procoDisplay.value = eq.value ? p : "";
});

async function add(){
  if(!oc.value || !eq.value || !dataOc.value){
    return alert("Preencha ao menos: Ocorrência, Equipe e Data");
  }

  let idAtual = editIndex===null ? gerarId() : (dados[editIndex].id || gerarId());

  let item = {
    id: idAtual,
    oc: oc.value.trim(),
    eq: eq.value.trim().toUpperCase(),
    data: normalizarData(dataOc.value),
    obs: obs.value.trim()
  };

  if(editIndex===null){
    dados.push(item);
  }else{
    dados[editIndex] = item;
    editIndex = null;
    btnAdd.innerText = "Adicionar";
  }

  salvarLocal();
  render();
  limparCampos();
  enviarParaPlanilha(item);
}

function editar(i){
  let d = dados[i];
  oc.value = d.oc || "";
  eq.value = d.eq || "";
  dataOc.value = d.data || "";
  obs.value = d.obs || "";
  procoDisplay.value = processoDe(d.eq);
  editIndex = i;
  btnAdd.innerText = "Atualizar";
  window.scrollTo(0,0);
}

function limparCampos(){
  oc.value=""; eq.value=""; dataOc.value=""; obs.value=""; procoDisplay.value="";
}

function limpar(){
  if(!confirm("Apagar todas as ocorrências cadastradas?")) return;
  dados=[];
  salvarLocal();
  render();
}

function excluir(i){
  if(!confirm("Excluir esta ocorrência?")) return;
  let item = dados[i];
  dados.splice(i,1);
  salvarLocal();
  render();
  excluirDaPlanilha(item);
}

function normalizarData(valor){
  // Corrige datas que chegam da planilha como Date/ISO completo
  // (ex: "2026-07-03T03:00:00.000Z") deixando sempre no formato "AAAA-MM-DD"
  if(!valor) return "";
  let s = String(valor).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // formato brasileiro D/M/AAAA ou DD/MM/AAAA vindo de alguma célula formatada
  // (aceita com ou sem zero à esquerda, ex: 7/1/2026 ou 07/01/2026)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return s;
}

function formatarDataBR(dataISO){
  if(!dataISO) return "-";
  let iso = normalizarData(dataISO);
  let [ano,mes,dia] = iso.split("-");
  if(!dia) return "-";
  return `${dia}/${mes}`;
}

function itemHtml(d){
  let i = dados.indexOf(d);
  let proc = processoDe(d.eq);
  return `
  <div class="listaItem">
    <div class="info">
      <span class="tagProc ${classeProcesso[proc]}">${proc}</span>
      <b>OC ${d.oc}</b> — ${d.eq} — ${formatarDataBR(d.data)}
      ${d.obs ? `<br><span class="obsPreview">📝 ${d.obs}</span>` : ""}
    </div>
    <div class="botoes">
      <button class="editar" onclick="editar(${i})">✏️</button>
      <button class="excluir" onclick="excluir(${i})">✖</button>
    </div>
  </div>`;
}

function render(){
  if(dados.length===0){
    lista.innerHTML = `<div class="semDados">Nenhuma ocorrência cadastrada ainda.</div>`;
    return;
  }

  let buscaEl = document.getElementById("buscaOc");
  let modoEl = document.getElementById("modoLista");
  let filtro = buscaEl ? buscaEl.value.trim().toLowerCase() : "";
  let modo = modoEl ? modoEl.value : "data";

  let filtrados = filtro
    ? dados.filter(d => String(d.oc||"").toLowerCase().includes(filtro))
    : dados;

  if(filtrados.length===0){
    lista.innerHTML = `<div class="semDados">Nenhuma OC encontrada para "${buscaEl.value}".</div>`;
    return;
  }

  if(modo === "equipe"){
    let porEq = {};
    filtrados.forEach(d=>{
      let key = d.eq || "SEM EQUIPE";
      (porEq[key] = porEq[key] || []).push(d);
    });
    let equipesOrdenadas = Object.keys(porEq).sort();
    lista.innerHTML = equipesOrdenadas.map(eqNome=>{
      let itens = porEq[eqNome].sort((a,b)=> (b.data||"").localeCompare(a.data||""));
      return `<div class="grupoEquipe">
        <div class="grupoTitulo">${eqNome} <span class="grupoQtd">${itens.length}</span></div>
        ${itens.map(itemHtml).join("")}
      </div>`;
    }).join("");
  }else{
    let ordenados = [...filtrados].sort((a,b)=> (b.data||"").localeCompare(a.data||""));
    lista.innerHTML = ordenados.map(itemHtml).join("");
  }
}

function toggleMassa(){
  let bloco = document.getElementById("blocoMassa");
  let abrindo = bloco.style.display === "none";
  bloco.style.display = abrindo ? "block" : "none";
  if(abrindo){
    document.getElementById("massaTexto").focus();
  }else{
    document.getElementById("statusMassa").innerText = "";
  }
}

function dividirLinhaMassa(linha){
  // tenta Tab (padrão ao colar de planilha), depois ; depois ,
  if(linha.includes("\t")) return linha.split("\t");
  if(linha.includes(";")) return linha.split(";");
  return linha.split(",");
}

async function processarMassa(){
  let texto = document.getElementById("massaTexto").value;
  let statusEl = document.getElementById("statusMassa");
  let linhas = texto.split("\n").map(l=>l.trim()).filter(l=>l!=="");

  if(linhas.length===0){
    statusEl.innerText = "⚠️ Cole ao menos uma linha com os dados das ocorrências.";
    return;
  }

  let adicionados = [];
  let erros = [];

  linhas.forEach((linha, idx)=>{
    let campos = dividirLinhaMassa(linha).map(c=>c.trim());
    let [ocVal, eqVal, dataVal, obsVal] = campos;

    if(!ocVal || !eqVal || !dataVal){
      erros.push(`Linha ${idx+1}: faltam dados (OC, Equipe ou Data) — "${linha}"`);
      return;
    }

    let dataNorm = normalizarData(dataVal);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dataNorm)){
      erros.push(`Linha ${idx+1}: data inválida ("${dataVal}")`);
      return;
    }

    let item = {
      id: gerarId(),
      oc: ocVal,
      eq: eqVal.toUpperCase(),
      data: dataNorm,
      obs: (obsVal||"").trim()
    };
    dados.push(item);
    adicionados.push(item);
  });

  if(adicionados.length){
    salvarLocal();
    render();
    statusEl.innerText = `🔄 Cadastrando ${adicionados.length} ocorrência(s)...`;
    for(const item of adicionados){
      await enviarParaPlanilha(item);
    }
  }

  let resumo = `✅ ${adicionados.length} ocorrência(s) cadastrada(s) com sucesso.`;
  if(erros.length){
    resumo += `\n⚠️ ${erros.length} linha(s) com problema:\n` + erros.join("\n");
  }else{
    document.getElementById("massaTexto").value = "";
  }
  statusEl.innerText = resumo;
}

function visualizar(){
  if(dados.length===0){
    alert("Cadastre ao menos uma ocorrência antes de gerar o relatório.");
    return;
  }

  // ordena por data e descobre intervalo do período
  let comData = dados.filter(d=>d.data).sort((a,b)=> a.data.localeCompare(b.data));
  let dataMin = comData[0].data;
  let dataMax = comData[comData.length-1].data;

  // gera lista contínua de dias entre min e max
  let dias = [];
  let cursor = new Date(dataMin+"T00:00:00");
  let fim = new Date(dataMax+"T00:00:00");
  while(cursor <= fim){
    let iso = cursor.toISOString().split("T")[0];
    dias.push(iso);
    cursor.setDate(cursor.getDate()+1);
  }

  // agrupamento por dia e processo
  let porDia = {};
  dias.forEach(dia=> porDia[dia] = {"OBRA":0,"MANUTENÇÃO":0,"LINHA VIVA":0,"OUTRO":0, total:0});

  let totalProcesso = {"OBRA":0,"MANUTENÇÃO":0,"LINHA VIVA":0,"OUTRO":0};
  let porEquipe = {};

  dados.forEach(d=>{
    let proc = processoDe(d.eq);
    totalProcesso[proc] = (totalProcesso[proc]||0) + 1;
    porEquipe[d.eq] = (porEquipe[d.eq]||0) + 1;

    if(d.data && porDia[d.data]){
      porDia[d.data][proc]++;
      porDia[d.data].total++;
    }
  });

  let totalGeral = dados.length;

  // monta linhas da tabela
  let linhasTabela = dias.map(dia=>{
    let r = porDia[dia];
    let pct = v => totalGeral ? ((v/totalGeral)*100).toFixed(1)+"%" : "0%";
    return `
    <div class="linha">
      <div>${formatarDataBR(dia)}</div>
      <div class="corOBRA">${r.OBRA} <small>(${pct(r.OBRA)})</small></div>
      <div class="corMANUTENCAO">${r["MANUTENÇÃO"]} <small>(${pct(r["MANUTENÇÃO"])})</small></div>
      <div class="corLV">${r["LINHA VIVA"]} <small>(${pct(r["LINHA VIVA"])})</small></div>
      <div><b>${r.total}</b> <small>(${pct(r.total)})</small></div>
    </div>`;
  }).join("");

  let linhaTotal = `
    <div class="linha linhaTotal">
      <div>TOTAL</div>
      <div class="corOBRA">${totalProcesso.OBRA}</div>
      <div class="corMANUTENCAO">${totalProcesso["MANUTENÇÃO"]}</div>
      <div class="corLV">${totalProcesso["LINHA VIVA"]}</div>
      <div>${totalGeral}</div>
    </div>`;

  // donut (SVG — conic-gradient não é renderizado corretamente pelo html2canvas)
  let donutSvg = gerarSvgDonut(totalGeral, totalProcesso, corProcesso);

  function pctG(v){ return totalGeral ? ((v/totalGeral)*100).toFixed(1)+"%" : "0%"; }

  // top equipes
  let topEquipes = Object.entries(porEquipe).sort((a,b)=>b[1]-a[1]).slice(0,8);
  let maiorValor = topEquipes.length ? topEquipes[0][1] : 1;

  let barrasHtml = topEquipes.map(([eqNome,qtd])=>{
    let proc = processoDe(eqNome);
    let largura = (qtd/maiorValor*100).toFixed(0);
    return `
    <div class="barraLinha">
      <div class="barraLabel">${eqNome}</div>
      <div class="barraFundo"><div class="barraPreench" style="width:${largura}%;background:${corProcesso[proc]}"></div></div>
      <div class="barraValor">${qtd}</div>
    </div>`;
  }).join("");

  // tabela de observações
  let comObs = dados.filter(d=>d.obs && d.obs.trim()!=="");
  let tabelaObsHtml;
  if(comObs.length===0){
    tabelaObsHtml = `<div class="semDados">Nenhuma OC com observação registrada.</div>`;
  }else{
    tabelaObsHtml = `
    <table class="tabelaObs">
      <tr><th>OC</th><th>Equipe</th><th>Processo</th><th>Data</th><th>Observação</th></tr>
      ${comObs.sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(d=>`
      <tr>
        <td>${d.oc}</td>
        <td>${d.eq}</td>
        <td>${processoDe(d.eq)}</td>
        <td>${formatarDataBR(d.data)}</td>
        <td>${d.obs}</td>
      </tr>`).join("")}
    </table>`;
  }

  let equipesAtivas = Object.keys(porEquipe).length;
  let agora = new Date();
  let periodoTexto = `${formatarDataBR(dataMin)} a ${formatarDataBR(dataMax)}`;

  relatorio.innerHTML = `
  <div class="cabecalhoRelatorio">
    <div class="topoFlex">
      <div class="logoEsquerda">⚡</div>
      <div class="tituloCentral">
        <h1>ACOMPANHAMENTO<br>TP-LV ENERGY</h1>
        <div class="infoData">
          📅 Período: ${periodoTexto} &nbsp;&nbsp; 🕒 Atualizado em ${agora.toLocaleDateString('pt-BR')} ${agora.toLocaleTimeString('pt-BR')}
        </div>
      </div>
    </div>
  </div>

  <div id="blocoDias">
  <div class="blocoTitulo">OCS ATENDIDAS POR DIA E POR PROCESSO</div>
  <div class="tabela">
    <div class="linha topoTabela">
      <div>DIA</div><div>OBRA</div><div>MANUTENÇÃO</div><div>LINHA VIVA</div><div>TOTAL</div>
    </div>
    ${linhasTabela}
    ${linhaTotal}
  </div>
  </div>

  <div class="cards">
    <div class="cardResumo"><div class="cardIcone">📋</div><div class="cardTexto"><span>Total de OCs</span><strong>${totalGeral}</strong></div></div>
    <div class="cardResumo"><div class="cardIcone">🏗️</div><div class="cardTexto"><span>Obra</span><strong>${totalProcesso.OBRA}</strong><small>${pctG(totalProcesso.OBRA)}</small></div></div>
    <div class="cardResumo"><div class="cardIcone">🔧</div><div class="cardTexto"><span>Manutenção</span><strong>${totalProcesso["MANUTENÇÃO"]}</strong><small>${pctG(totalProcesso["MANUTENÇÃO"])}</small></div></div>
    <div class="cardResumo"><div class="cardIcone">⚡</div><div class="cardTexto"><span>Linha Viva</span><strong>${totalProcesso["LINHA VIVA"]}</strong><small>${pctG(totalProcesso["LINHA VIVA"])}</small></div></div>
  </div>

 <div class="blocoDupla">
    <div class="painel">
      <div class="painelTitulo">DISTRIBUIÇÃO POR PROCESSO</div>
      <div class="donutWrap">
        <div class="donut">
          ${donutSvg}
          <div class="donutCentro"><strong>${totalGeral}</strong><span>TOTAL</span></div>
        </div>
        <div class="legenda">
          <div class="legendaItem"><span class="bolinha" style="background:${corProcesso.OBRA}"></span>Obra: ${totalProcesso.OBRA} (${pctG(totalProcesso.OBRA)})</div>
          <div class="legendaItem"><span class="bolinha" style="background:${corProcesso["MANUTENÇÃO"]}"></span>Manutenção: ${totalProcesso["MANUTENÇÃO"]} (${pctG(totalProcesso["MANUTENÇÃO"])})</div>
          <div class="legendaItem"><span class="bolinha" style="background:${corProcesso["LINHA VIVA"]}"></span>Linha Viva: ${totalProcesso["LINHA VIVA"]} (${pctG(totalProcesso["LINHA VIVA"])})</div>
        </div>
      </div>
    </div>

    <div class="painel">
      <div class="painelTitulo">TOP EQUIPES POR QUANTIDADE DE OCS</div>
      <div class="barrasWrap">${barrasHtml}</div>
    </div>
  </div>

  <div id="blocoObs">
    <div class="blocoTitulo">OCS COM OBSERVAÇÃO</div>
    ${tabelaObsHtml}
  </div>

  <div class="rodape">⚡ MANUTENÇÃO UTEP NORTE ⚡</div>
  `;

  tela1.style.display="none";
  tela2.style.display="block";
  window.scrollTo(0,0);
}

  tela1.style.display="block";
  tela2.style.display="none";
}

async function gerarPDF(){
  let botao = document.getElementById("btnPdf");
  let statusEl = document.getElementById("statusPdf");
  botao.disabled = true;
  botao.innerText = "⏳ Gerando PDF...";
  if(statusEl) statusEl.innerText = "🔄 Montando relatório em PDF...";
  window.scrollTo(0,0);

  let secoesPdf = null;
  try{
    const { jsPDF } = window.jspdf;

    // Antes: cada pedacinho do relatório (cabeçalho, tabela, cards, etc.) era
    // capturado como um bloco separado. Isso fazia o cabeçalho sozinho "reservar"
    // a página inteira quando a tabela de dias não cabia no espaço restante,
    // deixando a página 1 quase em branco.
    // Agora: juntamos cabeçalho+tabela em um único bloco, e cabeçalho+resto em
    // outro (mesma técnica já usada em gerar(), a exportação de imagem), para
    // que o conteúdo preencha a página corretamente e só quebre quando precisar.
    secoesPdf = montarSecoesRelatorio();
    if(!secoesPdf){
      throw new Error("Relatório vazio");
    }
    let blocos = [secoesPdf.parte1, secoesPdf.parte2].filter(Boolean);

    let pdf = new jsPDF("p", "mm", "a4");
    let larguraPagina = pdf.internal.pageSize.getWidth();
    let alturaPagina = pdf.internal.pageSize.getHeight();
    let margem = 0;
    let larguraUtil = larguraPagina - (margem*2);

    let cursorY = margem;
    let primeiraImagem = true;

    for(let bloco of blocos){
      let canvas = await html2canvas(bloco, {
        scale: 3,
        backgroundColor: "#ffffff",
        useCORS: true,
        allowTaint: true,
        logging: false
      });

      let escalaPxParaMm = larguraUtil / canvas.width;
      let alturaTotalMm = canvas.height * escalaPxParaMm;

      if(alturaTotalMm <= (alturaPagina - margem*2)){
        // O bloco inteiro cabe de uma vez: só quebra a página se não couber no espaço restante
        if(!primeiraImagem && (cursorY + alturaTotalMm) > (alturaPagina - margem)){
          pdf.addPage();
          cursorY = margem;
        }
        let imgDados = canvas.toDataURL("image/png");
        pdf.addImage(imgDados, "PNG", margem, cursorY, larguraUtil, alturaTotalMm);
        cursorY += alturaTotalMm;
        primeiraImagem = false;
      }else{
        // Bloco mais alto que uma página inteira (ex.: tabela grande de observações):
        // precisa fatiar esse bloco especificamente, sempre começando página nova.
        if(!primeiraImagem){
          pdf.addPage();
          cursorY = margem;
        }
        let pxPorPagina = Math.max(1, Math.floor((alturaPagina - margem*2) / escalaPxParaMm));
        let totalFatias = Math.ceil(canvas.height / pxPorPagina);

        for(let f = 0; f < totalFatias; f++){
          let origemY = f * pxPorPagina;
          let alturaFatiaPx = Math.min(pxPorPagina, canvas.height - origemY);
          if(alturaFatiaPx <= 0) break;

          let canvasFatia = document.createElement("canvas");
          canvasFatia.width = canvas.width;
          canvasFatia.height = alturaFatiaPx;
          let ctx = canvasFatia.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0,0,canvasFatia.width, canvasFatia.height);
          ctx.drawImage(canvas, 0, origemY, canvas.width, alturaFatiaPx, 0, 0, canvas.width, alturaFatiaPx);

          let alturaFatiaMm = alturaFatiaPx * escalaPxParaMm;
          if(f > 0) pdf.addPage();
          pdf.addImage(canvasFatia.toDataURL("image/png"), "PNG", margem, margem, larguraUtil, alturaFatiaMm);
        }
        cursorY = margem + ((canvas.height - (totalFatias-1)*pxPorPagina) * escalaPxParaMm);
        primeiraImagem = false;
      }
    }

    let agora = new Date();
    let nomeArquivo = `relatorio_tplv_${agora.toISOString().split("T")[0]}.pdf`;
    pdf.save(nomeArquivo);

    if(statusEl) statusEl.innerText = "✅ PDF gerado com sucesso!";
  }catch(err){
    console.error("Erro ao gerar PDF:", err);
    if(statusEl) statusEl.innerText = "⚠️ Não foi possível gerar o PDF.";
    alert("Ocorreu um erro ao gerar o PDF. Tente novamente.");
  }finally{
    if(secoesPdf){
      if(secoesPdf.parte1 && secoesPdf.parte1.parentNode) document.body.removeChild(secoesPdf.parte1);
      if(secoesPdf.parte2 && secoesPdf.parte2.parentNode) document.body.removeChild(secoesPdf.parte2);
    }
    botao.disabled = false;
    botao.innerText = "📄 Gerar PDF";
    clearTimeout(window._statusPdfTimeout);
    window._statusPdfTimeout = setTimeout(()=>{ if(statusEl) statusEl.innerText = ""; }, 4000);
  }
}

function montarSecoesRelatorio(){
  // Monta dois containers "fora da tela" com base no #relatorio já renderizado:
  // Parte 1: cabeçalho + tabela diária (ocorrências por dia/equipe)
  // Parte 2: cabeçalho + cards-resumo + donut/top equipes + observações + rodapé
  let cabecalho = relatorio.querySelector(".cabecalhoRelatorio");
  let blocoDias = document.getElementById("blocoDias");
  let cardsEl = relatorio.querySelector(".cards");
  let blocoDupla = relatorio.querySelector(".blocoDupla");
  let blocoObs = document.getElementById("blocoObs");
  let rodape = relatorio.querySelector(".rodape");

  if(!cabecalho || !blocoDias){
    return null;
  }

  let largura = relatorio.offsetWidth + "px";

  let parte1 = document.createElement("div");
  parte1.style.cssText = `position:absolute;left:-9999px;top:0;background:#ffffff;width:${largura};`;
  parte1.appendChild(cabecalho.cloneNode(true));
  parte1.appendChild(blocoDias.cloneNode(true));

  let parte2 = document.createElement("div");
  parte2.style.cssText = `position:absolute;left:-9999px;top:0;background:#ffffff;width:${largura};`;
  parte2.appendChild(cabecalho.cloneNode(true));
  if(cardsEl) parte2.appendChild(cardsEl.cloneNode(true));
  if(blocoDupla) parte2.appendChild(blocoDupla.cloneNode(true));
  if(blocoObs) parte2.appendChild(blocoObs.cloneNode(true));
  if(rodape) parte2.appendChild(rodape.cloneNode(true));

  document.body.appendChild(parte1);
  document.body.appendChild(parte2);

  return { parte1, parte2 };
}

async function gerar(){
  window.scrollTo(0,0);
  let botao = document.getElementById("btnImagem");
  if(botao){ botao.disabled = true; botao.innerText = "⏳ Gerando imagens..."; }

  let secoes = montarSecoesRelatorio();
  if(!secoes){
    if(botao){ botao.disabled = false; botao.innerText = "📷 Gerar Imagem"; }
    alert("Gere o relatório antes de exportar as imagens.");
    return;
  }
  let { parte1, parte2 } = secoes;

  try{
    let canvas1 = await html2canvas(parte1, {scale:3, backgroundColor:"#ffffff", useCORS:true, allowTaint:true, logging:false});
    let link1 = document.createElement('a');
    link1.download = "relatorio_tplv_atendimento_diario.png";
    link1.href = canvas1.toDataURL("image/png");
    link1.click();

    let canvas2 = await html2canvas(parte2, {scale:3, backgroundColor:"#ffffff", useCORS:true, allowTaint:true, logging:false});
    let link2 = document.createElement('a');
    link2.download = "relatorio_tplv_resumo.png";
    link2.href = canvas2.toDataURL("image/png");
    link2.click();
  }catch(err){
    console.error("Erro ao gerar imagem:", err);
    alert("Ocorreu um erro ao gerar a imagem. Tente novamente.");
  }finally{
    document.body.removeChild(parte1);
    document.body.removeChild(parte2);
    if(botao){ botao.disabled = false; botao.innerText = "📷 Gerar Imagem"; }
  }
}

(async function iniciar(){
  let sincronizado = await carregarDaPlanilha(false);
  if(!sincronizado) carregarLocal();
})();
